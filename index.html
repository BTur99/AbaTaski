<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация по проектам</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 720px;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f0f6fc;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 32px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 16px;
        }
        .file-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-list li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 1.05rem;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .file-list li a:hover {
            background: #1c2128;
            border-color: #58a6ff;
            color: #f0f6fc;
            transform: translateX(4px);
        }
        .file-icon {
            font-size: 1.4rem;
            opacity: 0.8;
            width: 32px;
            text-align: center;
        }
        .file-name {
            flex: 1;
        }
        .file-ext {
            font-size: 0.75rem;
            color: #8b949e;
            background: #21262d;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .footer {
            margin-top: 36px;
            text-align: center;
            color: #484f58;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 vibecoding</h1>
        <p class="subtitle">Выберите файл для открытия</p>
        <ul class="file-list">
            <li>
                <a href="cursor.html">
                    <span class="file-icon">📄</span>
                    <span class="file-name">cursor.html</span>
                    <span class="file-ext">HTML</span>
                </a>
            </li>
            <li>
                <a href="deepseek.html">
                    <span class="file-icon">📄</span>
                    <span class="file-name">deepseek.html</span>
                    <span class="file-ext">HTML</span>
                </a>
            </li>
            <li>
                <a href="gigachat.html">
                    <span class="file-icon">📄</span>
                    <span class="file-name">gigachat.html</span>
                    <span class="file-ext">HTML</span>
                </a>
            </li>
            <li>
                <a href="qwen_agent.html">
                    <span class="file-icon">📄</span>
                    <span class="file-name">qwen_agent.html</span>
                    <span class="file-ext">HTML</span>
                </a>
            </li>
            <li>
                <a href="qwen_web.html">
                    <span class="file-icon">📄</span>
                    <span class="file-name">qwen_web.html</span>
                    <span class="file-ext">HTML</span>
                </a>
            </li>
            <li>
                <a href="z_ai.html">
                    <span class="file-icon">📄</span>
                    <span class="file-name">z_ai.html</span>
                    <span class="file-ext">HTML</span>
                </a>
            </li>
        </ul>
        <p class="footer">vibecoding · локальный навигатор</p>
    </div>
</body>
</html>
